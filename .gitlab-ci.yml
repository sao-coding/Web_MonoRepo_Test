stages:
  - check
  - build-docker
  - deploy-docker
  - publish-npm

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_NAME

check-affected:
  stage: check
  image: node:latest
  only:
    - merge_requests
  before_script:
    - export SHELL=/bin/bash
    - npm install --global corepack@latest
    - corepack enable
    - corepack prepare pnpm@latest-10 --activate
    - export PNPM_HOME="/root/.local/share/pnpm"
    - export PATH="$PNPM_HOME:$PATH"
    - pnpm setup
    - pnpm config set store-dir .pnpm-store
    - pnpm install -g turbo@latest
    - apt-get update && apt-get install -y jq
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME --depth=1
  script:
    - export TURBO_SCM_BASE=origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - turbo run build --affected --dry=json > affected-packages.json
    - |
      if [ "$(jq '.packages | length' affected-packages.json)" -eq 0 ]; then
        echo "沒有包受到影響，跳過後續步驟"
        exit 0
      fi
    - export AFFECTED_APPS=$(jq -r '.packages[] | select(. != "//")' affected-packages.json | xargs -I{} jq -r --arg pkg {} '.tasks[] | select(.package == $pkg and (.directory | type=="string") and (.directory | startswith("apps/"))) | .package' affected-packages.json | sort -u | tr '\n' ' ')
    - export AFFECTED_PACKAGES=$(jq -r '.packages[] | select(. != "//")' affected-packages.json | xargs -I{} jq -r --arg pkg {} '.tasks[] | select(.package == $pkg and (.directory | type=="string") and (.directory | startswith("packages/"))) | .package' affected-packages.json | sort -u | tr '\n' ' ')
    - 'echo "受影響的應用程式: $AFFECTED_APPS"'
    - 'echo "受影響的套件: $AFFECTED_PACKAGES"'
    - |
      if [ -z "$AFFECTED_APPS" ]; then
        echo "AFFECTED_APPS=" >> build.env
      else
        echo "AFFECTED_APPS=$AFFECTED_APPS" >> build.env
      fi
      if [ -z "$AFFECTED_PACKAGES" ]; then
        echo "AFFECTED_PACKAGES=" >> build.env
      else
        echo "AFFECTED_PACKAGES=$AFFECTED_PACKAGES" >> build.env
      fi
  artifacts:
    reports:
      dotenv: build.env

build-docker:
  stage: build-docker
  image: docker:latest
  services:
    - name: docker:dind
      command: ['--insecure-registry=192.168.2.40:5005']
  variables:
    DOCKER_TLS_CERTDIR: ''
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
  script:
    - 'if [ -z "$AFFECTED_APPS" ]; then echo "沒有受影響的應用程式，跳過 Docker 構建"; exit 0; fi'
    - echo "Docker 登入"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - |
      for app in $AFFECTED_APPS; do
        echo "構建 Docker 映像檔: $app"
        echo "使用的參數: APP_NAME=$app, TURBO_TEAM=$TURBO_TEAM, TURBO_TOKEN=$TURBO_TOKEN"
        docker build -f ./apps/$app/Dockerfile -t $IMAGE_TAG-$app . --build-arg APP_NAME=$app --build-arg TURBO_TEAM=$TURBO_TEAM --build-arg TURBO_TOKEN=$TURBO_TOKEN --no-cache
        docker push $IMAGE_TAG-$app
      done
  needs:
    - job: check-affected
      artifacts: true
  rules:
    - if: '$AFFECTED_APPS != ""'

deploy-docker:
  stage: deploy-docker
  image: debian:bullseye
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)

    # 使用常規處理流程
    - echo "Debugging: Printing SSH_PRIVATE_KEY content (for debugging only)"
    - echo "${SSH_PRIVATE_KEY}"
    - echo "${SSH_PRIVATE_KEY}" | tr -d '\r' > deploy.pem
    - chmod 400 deploy.pem

    # 檢查檔案是否為有效私鑰並印出內容進行偵錯
    - echo "Debugging: Printing deploy.pem content (for debugging only)"
    - cat deploy.pem
    - echo "檢查私鑰檔案格式："
    - ssh-keygen -l -f deploy.pem || echo "私鑰格式無效，請確認 GitLab CI/CD 變數設定正確"

    # 繼續原有流程
    - ssh-add deploy.pem
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - 'if [ -z "$AFFECTED_APPS" ]; then echo "沒有受影響的應用程式，跳過部署"; exit 0; fi'
    - |
      for app in $AFFECTED_APPS; do
        echo "部署應用程式: $app"
        ssh ${SSH_USER}@${SSH_SERVER_IP} "docker pull $IMAGE_TAG-$app && docker run -d --name $app -p 3000:3000 $IMAGE_TAG-$app"
      done
  needs:
    - job: check-affected
      artifacts: true
    - job: build-docker
  rules:
    - if: '$AFFECTED_APPS != ""'
