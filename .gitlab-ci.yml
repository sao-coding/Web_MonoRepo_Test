# include:
#   - local: .gitlab/workflows/docker.gitlab-ci.yml
stages:
  - install
  - build

# 全局 before_script，適用於所有階段
before_script:
  - export SHELL=/bin/bash
  - npm install --global corepack@latest
  - corepack enable
  - corepack prepare pnpm@latest-10 --activate
  - export PNPM_HOME="/root/.local/share/pnpm"
  - export PATH="$PNPM_HOME:$PATH"
  - pnpm setup
  - pnpm config set store-dir .pnpm-store
  - pnpm install -g turbo@latest

install_dependencies:
  stage: install
  image: node:18
  script:
    - turbo -h

build:
  stage: build
  image: node:18
  script:
    - pnpm install --frozen-lockfile
    - turbo run build --affected --base=origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  only:
    - merge_requests
