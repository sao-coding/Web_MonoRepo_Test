# =============================================================================
# Docker Compose 模板檔
# =============================================================================
# 使用方式:
#   docker compose --env-file .env.compose.dev up -d      # Dev 環境
#   docker compose --env-file .env.compose.prod up -d     # Prod 環境
#
# Port 配置說明:
# - Traefik: 80 (HTTP), 8080 (Dashboard)
# - 各 App 內部 Port 不對外暴露，由 Traefik 統一路由
#
# Priority 規則:
# - PostHog PathPrefix('/') = 15，所有服務需 > 15
# - 主服務 (aiforce) = 100
# - 子服務 = 200

services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.6.6}
    container_name: ${TRAEFIK_CONTAINER:-traefik}
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --log.level=${TRAEFIK_LOG_LEVEL:-DEBUG}
    ports:
      - "${TRAEFIK_HOSTPORT_WEB:-80}:80"
      - "${TRAEFIK_HOSTPORT_DASHBOARD:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ${NETWORK_NAME:-ai-city}
    restart: unless-stopped

  aiforce:
    build:
      context: .
      dockerfile: ${AIFORCE_DOCKERFILE:-apps/aiforce/Dockerfile}
      args:
        APP_ENV: ${APP_ENV:-development}
        NEXT_PUBLIC_RD_SITE_URL: ${NEXT_PUBLIC_RD_SITE_URL:-}
        NEXT_PUBLIC_LOGIN_API_URL: ${NEXT_PUBLIC_LOGIN_API_URL:-}
        NEXT_PUBLIC_BASE_PATH_URL: ${NEXT_PUBLIC_BASE_PATH_URL:-/AI_City}
        NEXT_PUBLIC_COOKIE_DOMAIN: ${NEXT_PUBLIC_COOKIE_DOMAIN:-}
        NEXT_PUBLIC_NIM_SERVICE_API_URL: ${NEXT_PUBLIC_NIM_SERVICE_API_URL:-}
        NEXT_PUBLIC_PATENT_SERVICE_API_URL: ${NEXT_PUBLIC_PATENT_SERVICE_API_URL:-}
        NEXT_PUBLIC_AI_API_URL: ${NEXT_PUBLIC_AI_API_URL:-}
        NEXT_PUBLIC_VGA_AI_API_URL: ${NEXT_PUBLIC_VGA_AI_API_URL:-}
        NEXT_PUBLIC_AIforce_API_URL: ${NEXT_PUBLIC_AIforce_API_URL:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
    container_name: ${AIFORCE_CONTAINER:-aiforce}
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_ENV=${APP_ENV:-development}
      - PORT=${AIFORCE_PORT:-3001}
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aiforce.rule=PathPrefix(`/AI_City`)"
      - "traefik.http.routers.aiforce.priority=100"
      - "traefik.http.routers.aiforce.entrypoints=web"
      - "traefik.http.services.aiforce.loadbalancer.server.port=${AIFORCE_PORT:-3001}"
    networks:
      - ${NETWORK_NAME:-ai-city}
    restart: unless-stopped
    depends_on:
      - traefik

  aiforce-productspec:
    build:
      context: .
      dockerfile: apps/aiforce-productspec/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-development}
    container_name: ${PRODUCTSPEC_CONTAINER:-aiforce-productspec}
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_ENV=${APP_ENV:-development}
      - PORT=${PRODUCTSPEC_PORT:-3002}
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aiforce-productspec.rule=PathPrefix(`/AI_City/ProductSpec`)"
      - "traefik.http.routers.aiforce-productspec.priority=200"
      - "traefik.http.routers.aiforce-productspec.entrypoints=web"
      - "traefik.http.services.aiforce-productspec.loadbalancer.server.port=${PRODUCTSPEC_PORT:-3002}"
    networks:
      - ${NETWORK_NAME:-ai-city}
    restart: unless-stopped
    depends_on:
      - traefik

  aiforce-asr:
    build:
      context: .
      dockerfile: apps/aiforce-asr/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-development}
    container_name: ${ASR_CONTAINER:-aiforce-asr}
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_ENV=${APP_ENV:-development}
      - PORT=${ASR_PORT:-3003}
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aiforce-asr.rule=PathPrefix(`/AI_City/asr`)"
      - "traefik.http.routers.aiforce-asr.priority=200"
      - "traefik.http.routers.aiforce-asr.entrypoints=web"
      - "traefik.http.services.aiforce-asr.loadbalancer.server.port=${ASR_PORT:-3003}"
    networks:
      - ${NETWORK_NAME:-ai-city}
    restart: unless-stopped
    depends_on:
      - traefik

  aiforce-translate:
    build:
      context: .
      dockerfile: apps/aiforce-translate/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-development}
    container_name: ${TRANSLATE_CONTAINER:-aiforce-translate}
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_ENV=${APP_ENV:-development}
      - PORT=${TRANSLATE_PORT:-3004}
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aiforce-translate.rule=PathPrefix(`/AI_City/translate`)"
      - "traefik.http.routers.aiforce-translate.priority=200"
      - "traefik.http.routers.aiforce-translate.entrypoints=web"
      - "traefik.http.services.aiforce-translate.loadbalancer.server.port=${TRANSLATE_PORT:-3004}"
    networks:
      - ${NETWORK_NAME:-ai-city}
    restart: unless-stopped
    depends_on:
      - traefik

  aiforce-tts:
    build:
      context: .
      dockerfile: apps/aiforce-tts/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-development}
    container_name: ${TTS_CONTAINER:-aiforce-tts}
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_ENV=${APP_ENV:-development}
      - PORT=${TTS_PORT:-3005}
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aiforce-tts.rule=PathPrefix(`/AI_City/tts`)"
      - "traefik.http.routers.aiforce-tts.priority=200"
      - "traefik.http.routers.aiforce-tts.entrypoints=web"
      - "traefik.http.services.aiforce-tts.loadbalancer.server.port=${TTS_PORT:-3005}"
    networks:
      - ${NETWORK_NAME:-ai-city}
    restart: unless-stopped
    depends_on:
      - traefik

  aiforce-img2text:
    build:
      context: .
      dockerfile: apps/aiforce-img2text/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-development}
    container_name: ${IMG2TEXT_CONTAINER:-aiforce-img2text}
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_ENV=${APP_ENV:-development}
      - PORT=${IMG2TEXT_PORT:-3006}
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aiforce-img2text.rule=PathPrefix(`/AI_City/img2text`)"
      - "traefik.http.routers.aiforce-img2text.priority=200"
      - "traefik.http.routers.aiforce-img2text.entrypoints=web"
      - "traefik.http.services.aiforce-img2text.loadbalancer.server.port=${IMG2TEXT_PORT:-3006}"
    networks:
      - ${NETWORK_NAME:-ai-city}
    restart: unless-stopped
    depends_on:
      - traefik

