services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3001:3000' # host:container
    environment:
      - NODE_ENV=production
    restart: always

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    ports:
      - '3002:3000'
    environment:
      - NODE_ENV=production
    restart: always

  # 可以持續新增其他子專案
