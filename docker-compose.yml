    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aiforce-tts.rule=PathPrefix(`/AI_City/tts`)"
      - "traefik.http.routers.aiforce-tts.priority=200"
      - "traefik.http.routers.aiforce-tts.entrypoints=websecure"
      - "traefik.http.routers.aiforce-tts.tls=true"
      - "traefik.http.services.aiforce-tts.loadbalancer.server.port=${TTS_PORT:-3005}"
    networks:
      - traefik-proxy
    restart: unless-stopped

  aiforce-img2text:
    build:
      context: .
      dockerfile: apps/aiforce-img2text/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-development}
    container_name: ${IMG2TEXT_CONTAINER:-aiforce-img2text}
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_ENV=${APP_ENV:-development}
      - PORT=${IMG2TEXT_PORT:-3006}
