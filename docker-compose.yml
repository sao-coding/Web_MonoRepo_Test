      dockerfile: apps/aiforce-tts/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-development}
    container_name: ${TTS_CONTAINER:-aiforce-tts}
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_ENV=${APP_ENV:-development}
      - PORT=${TTS_PORT:-3005}
      - HOSTNAME=0.0.0.0
    env_file:
