      - "traefik.http.routers.aiforce-img2text.tls=true"
      - "traefik.http.services.aiforce-img2text.loadbalancer.server.port=${IMG2TEXT_PORT:-3006}"
    networks:
      - traefik-proxy
    restart: unless-stopped

