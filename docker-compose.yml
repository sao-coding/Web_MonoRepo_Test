services:
  web: # 服务名，Swarm 会根据该名称创建服务
    image: 192.168.2.40:5005/msi/monorepo/web:main # 服务所用的镜像地址
    container_name: msi_stack_web # 容器名称，保持一致以便管理
    ports:
      - '3001:3000' # 将容器的 3000 端口映射到宿主机的 3001 端口
    environment:
      - NODE_ENV=production # 设置环境变量，指明环境为生产模式
    deploy:
      replicas: 3 # 服务副本数，Swarm 会确保运行 3 个副本
      update_config:
        parallelism: 1 # 每次更新只更新一个副本，保证滚动更新
        delay: 10s # 每次更新之间等待 10 秒，避免过多容器同时停止
        failure_action: rollback # 更新失败时回滚到上一个版本
      restart_policy:
        condition: any # 只要容器退出就会自动重启，无论是正常退出还是异常退出
    networks:
      - msi # 指定使用的网络，多个服务可以共享该网络

networks:
  msi:
    driver: overlay # 使用 Swarm 网络驱动（overlay），适用于跨主机的服务通信
