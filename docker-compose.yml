# Docker Compose for Development Environment (10.16.20.11)
# 使用方式: docker compose --env-file .env.compose.{dev/test/prod} up -d --build
#
# Port 配置說明:
# - Traefik: 80 (HTTP), 8080 (Dashboard)
# - 各 App 內部 Port 不對外暴露，由 Traefik 統一路由
# - 避免與現有 PM2 服務衝突 (3001-3003)
services:
  traefik:
    image: ${TRAEFIK_IMAGE}
    container_name: ${TRAEFIK_CONTAINER}
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=${TRAEFIK_ENTRYPOINT_WEB_ADDR}
      - --log.level=DEBUG
    ports:
      - "${TRAEFIK_HOSTPORT_WEB}:80"
      - "${TRAEFIK_HOSTPORT_DASHBOARD}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ${NETWORK_NAME}
    restart: unless-stopped

  aicity:
    build:
      context: .
      dockerfile: ${AICITY_DOCKERFILE}
      args:
        APP_ENV: ${APP_ENV}
    container_name: ${AICITY_CONTAINER}
    environment:
      - NODE_ENV=${NODE_ENV}
      - APP_ENV=${APP_ENV}
      - PORT=${AICITY_PORT}
      - HOSTNAME=${HOSTNAME}
    env_file:
      - .env.dev
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aicity.rule=${AICITY_RULE}"
      - "traefik.http.routers.aicity.priority=${AICITY_PRIORITY}"
      - "traefik.http.routers.aicity.entrypoints=${AICITY_ENTRYPOINT}"
      - "traefik.http.services.aicity.loadbalancer.server.port=${AICITY_PORT}"
    networks:
      - ${NETWORK_NAME}
    restart: unless-stopped
    depends_on:
      - traefik

  product-spec:
    build:
      context: .
      dockerfile: ${PRODUCTSPEC_DOCKERFILE}
      args:
        APP_ENV: ${APP_ENV}
    container_name: ${PRODUCTSPEC_CONTAINER}
    environment:
      - NODE_ENV=${NODE_ENV}
      - APP_ENV=${APP_ENV}
      - PORT=${PRODUCTSPEC_PORT}
      - HOSTNAME=${HOSTNAME}
    env_file:
      - .env.dev
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.productspec.rule=${PRODUCTSPEC_RULE}"
      - "traefik.http.routers.productspec.priority=${PRODUCTSPEC_PRIORITY}"
      - "traefik.http.routers.productspec.entrypoints=${PRODUCTSPEC_ENTRYPOINT}"
      - "traefik.http.services.productspec.loadbalancer.server.port=${PRODUCTSPEC_PORT}"
    networks:
      - ${NETWORK_NAME}
    restart: unless-stopped
    depends_on:
      - traefik

  asr:
    build:
      context: .
      dockerfile: ${ASR_DOCKERFILE}
      args:
        APP_ENV: ${APP_ENV}
    container_name: ${ASR_CONTAINER}
    environment:
      - NODE_ENV=${NODE_ENV}
      - APP_ENV=${APP_ENV}
      - PORT=${ASR_PORT}
      - HOSTNAME=${HOSTNAME}
    env_file:
      - .env.dev
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.asr.rule=${ASR_RULE}"
      - "traefik.http.routers.asr.priority=${ASR_PRIORITY}"
      - "traefik.http.routers.asr.entrypoints=${ASR_ENTRYPOINT}"
      - "traefik.http.services.asr.loadbalancer.server.port=${ASR_PORT}"
    networks:
      - ${NETWORK_NAME}
    restart: unless-stopped
    depends_on:
      - traefik

networks:
  ai-city:
    driver: bridge
