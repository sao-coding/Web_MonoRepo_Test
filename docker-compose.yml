      - "traefik.http.routers.aiforce-asr.priority=200"
      - "traefik.http.routers.aiforce-asr.entrypoints=websecure"
      - "traefik.http.routers.aiforce-asr.tls=true"
      - "traefik.http.services.aiforce-asr.loadbalancer.server.port=${ASR_PORT:-3003}"
    networks:
      - traefik-proxy
    restart: unless-stopped

  aiforce-translate:
    build:
      context: .
      dockerfile: apps/aiforce-translate/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-development}
    container_name: ${TRANSLATE_CONTAINER:-aiforce-translate}
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_ENV=${APP_ENV:-development}
      - PORT=${TRANSLATE_PORT:-3004}
      - HOSTNAME=0.0.0.0
    env_file:
