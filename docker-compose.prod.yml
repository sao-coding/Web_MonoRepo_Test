# Docker Compose for Production Environment (10.16.20.36)
# 使用方式: docker compose -f docker-compose.prod.yml up -d --build
#
# Port 配置說明:
# - Traefik: 80 (HTTP) - Dashboard 已關閉
# - 各 App 內部 Port 不對外暴露，由 Traefik 統一路由
#
# 安全設定:
# - Dashboard 關閉
# - Log level: WARN (只記錄警告以上)
# - restart: always

services:
  traefik:
    image: traefik:v3.6.6
    container_name: traefik-prod
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --log.level=WARN
    ports:
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ai-city
    restart: always

  rd-aicity:
    build:
      context: .
      dockerfile: apps/rd_aicity/Dockerfile
      args:
        APP_ENV: production
    container_name: rd-aicity-prod
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
    env_file:
      - .env.prod
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aicity.rule=PathPrefix(`/AI_City`)"
      - "traefik.http.routers.aicity.priority=1"
      - "traefik.http.routers.aicity.entrypoints=web"
      - "traefik.http.services.aicity.loadbalancer.server.port=3001"
    networks:
      - ai-city
    restart: always
    depends_on:
      - traefik

  product-spec:
    build:
      context: .
      dockerfile: apps/product-spec/Dockerfile
      args:
        APP_ENV: production
    container_name: product-spec-prod
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - PORT=3002
      - HOSTNAME=0.0.0.0
    env_file:
      - .env.prod
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.productspec.rule=PathPrefix(`/AI_City/ProductSpec`)"
      - "traefik.http.routers.productspec.priority=10"
      - "traefik.http.routers.productspec.entrypoints=web"
      - "traefik.http.services.productspec.loadbalancer.server.port=3002"
    networks:
      - ai-city
    restart: always
    depends_on:
      - traefik

  asr:
    build:
      context: .
      dockerfile: apps/asr/Dockerfile
      args:
        APP_ENV: production
    container_name: asr-prod
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - PORT=3003
      - HOSTNAME=0.0.0.0
    env_file:
      - .env.prod
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.asr.rule=PathPrefix(`/AI_City/asr`)"
      - "traefik.http.routers.asr.priority=10"
      - "traefik.http.routers.asr.entrypoints=web"
      - "traefik.http.services.asr.loadbalancer.server.port=3003"
    networks:
      - ai-city
    restart: always
    depends_on:
      - traefik

networks:
  ai-city:
    driver: bridge
