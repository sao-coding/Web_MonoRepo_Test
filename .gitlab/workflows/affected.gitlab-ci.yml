stages:
  - install
  - build

install_dependencies:
  stage: install
  image: node:18
  script:
    - npm install -g turbo
    - npm install

build:
  stage: build
  image: node:18
  script:
    - turbo run build --affected --base=origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  only:
    - merge_requests
