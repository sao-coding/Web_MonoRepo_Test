stages:
  - detect
  - build
  - deploy

variables:
  TURBO_FILTER: ''

detect-changes:
  stage: detect
  image: node:22-slim
  script:
    - echo "檢測變更的項目..."
    - npx turbo-ignore --task=build > affected.txt || true
    - export TURBO_FILTER=$(cat affected.txt | tr '\n' ',' | sed 's/,$//')
    - echo "變更的項目:"
    - echo $TURBO_FILTER | tr ',' '\n' | while read project; do echo "  - $project"; done
  artifacts:
    reports:
      dotenv: affected.env

web-build:
  stage: build
  image: docker:latest
  only:
    variables:
      - $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  services:
    - name: docker:dind
      command: ['--insecure-registry=192.168.2.40:5005']
  variables:
    DOCKER_TLS_CERTDIR: ''
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
  script:
    - if [[ -z "$TURBO_FILTER" ]]; then echo "沒有變更的項目，跳過構建"; exit 0; fi
    - echo "Building Docker images for affected projects:"
    - echo $TURBO_FILTER | tr ',' '\n' | while read project; do echo "  - $project"; done
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - for project in $(echo $TURBO_FILTER | tr ',' '\n'); do
      echo "Building Docker image for $project...";
      docker build -f ./apps/$project/Dockerfile -t $CI_REGISTRY_IMAGE/$project:$CI_COMMIT_REF_NAME . --build-arg TURBO_TEAM=$TURBO_TEAM --build-arg TURBO_TOKEN=$TURBO_TOKEN --no-cache;
      docker push $CI_REGISTRY_IMAGE/$project:$CI_COMMIT_REF_NAME;
      done

web-deploy:
  stage: deploy
  image: debian:bullseye
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY}" | tr -d '\r' > deploy.pem
    - chmod 400 deploy.pem
    - ssh-add deploy.pem
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - if [[ -z "$TURBO_FILTER" ]]; then echo "沒有變更的項目，跳過部署"; exit 0; fi
    - echo "🚀 部署變更的項目:"
    - echo $TURBO_FILTER | tr ',' '\n' | while read project; do echo "  - $project"; done
    - for project in $(echo $TURBO_FILTER | tr ',' '\n'); do
      echo "Deploying $project...";
      ssh ${SSH_USER}@${SSH_SERVER_IP} "docker pull $CI_REGISTRY_IMAGE/$project:$CI_COMMIT_REF_NAME && docker stack deploy -c /home/${SSH_USER}/docker/$project/docker-compose.yml $project --with-registry-auth";
      done
