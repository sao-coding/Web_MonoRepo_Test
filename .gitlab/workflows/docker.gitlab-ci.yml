stages:
  - check
  - build
  - deploy

# 🧪 檢查有變動的子專案
check-affected:
  stage: check
  image: node:20
  script:
    - npm install -g turbo
    - turbo run build --dry=json --filter=[HEAD^1] > affected.json
    - |
      AFFECTED=$(jq -r '.pipeline.build.tasks[].package' affected.json | grep "^apps/" | cut -d/ -f2 | paste -sd "," -)
      echo "AFFECTED=$AFFECTED"
      echo "AFFECTED_SERVICES=$AFFECTED" >> affected.env
  artifacts:
    reports:
      dotenv: affected.env

# 🚀 部署變動的子專案
deploy:
  stage: deploy
  image: debian:bullseye
  dependencies:
    - check-affected
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - apt-get install -y jq
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY}" | tr -d '\r' > deploy.pem
    - chmod 400 deploy.pem
    - ssh-add deploy.pem
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - echo "🔍 有變動的子專案：$AFFECTED_SERVICES"
    - echo "📦 傳送 docker-compose.yml 至伺服器"
    - scp docker-compose.yml ${SSH_USER}@${SSH_SERVER_IP}:/home/only/docker/docker-compose.yml

    - echo "🧹 清除舊容器（僅針對變動服務）"
    - |
      for service in $(echo $AFFECTED_SERVICES | tr ',' ' '); do
        ssh ${SSH_USER}@${SSH_SERVER_IP} "cd /home/only/docker && docker compose stop $service || true"
        ssh ${SSH_USER}@${SSH_SERVER_IP} "cd /home/only/docker && docker compose rm -f $service || true"
      done

    - echo "🚀 部署變動的服務"
    - |
      for service in $(echo $AFFECTED_SERVICES | tr ',' ' '); do
        ssh ${SSH_USER}@${SSH_SERVER_IP} "cd /home/only/docker && docker compose up -d --build $service"
      done

    - echo "✅ 完成差異化部署"
