<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      .tiptap.ProseMirror {
        border: 1px solid #ddd;
        padding: 16px;
        min-height: 200px;
      }
      .tiptap table {
        border-collapse: collapse;
        width: 100%;
      }
      .tiptap th,
      .tiptap td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      .tiptap th {
        background-color: #f4f4f4;
      }
      .tiptap tr:nth-child(even) {
        background-color: #f9f9f9;
      }
      .tiptap tr:hover {
        background-color: #f1f1f1;
      }
      .menu-bar {
        display: flex;
        background: #f9f9f9;
        padding: 8px;
        border: 1px solid #ddd;
        border-bottom: none;
      }
      .menu-bar button {
        margin-right: 5px;
        background: white;
        border: 1px solid #ddd;
        padding: 5px 10px;
        border-radius: 3px;
        cursor: pointer;
      }
      .menu-bar button.is-active {
        background: #eee;
      }
      .export-output {
        margin-top: 20px;
        padding: 10px;
        border: 1px solid #ddd;
        background-color: #f9f9f9;
        white-space: pre-wrap;
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="menu-bar"></div>
    <div class="element"></div>
    <div class="export-output"></div>
    <script type="module">
      import { Editor } from 'https://esm.sh/@tiptap/core'
      import StarterKit from 'https://esm.sh/@tiptap/starter-kit'
      import Table from 'https://esm.sh/@tiptap/extension-table'
      import TableRow from 'https://esm.sh/@tiptap/extension-table-row'
      import TableCell from 'https://esm.sh/@tiptap/extension-table-cell'
      import TableHeader from 'https://esm.sh/@tiptap/extension-table-header'
      import BubbleMenu from 'https://esm.sh/@tiptap/extension-bubble-menu'

      // 建立編輯器
      const editor = new Editor({
        element: document.querySelector('.element'),
        extensions: [
          StarterKit,
          Table,
          TableRow,
          TableCell,
          TableHeader,
          BubbleMenu.configure({
            element: document.createElement('div')
          })
        ],
        content: '<p>Hello World!</p>'
      })

      // 建立基本工具列
      const menuBar = document.querySelector('.menu-bar')

      // 粗體按鈕
      const boldButton = document.createElement('button')
      boldButton.innerHTML = '粗體'
      boldButton.addEventListener('click', () => {
        editor.chain().focus().toggleBold().run()
      })
      menuBar.appendChild(boldButton)

      // 斜體按鈕
      const italicButton = document.createElement('button')
      italicButton.innerHTML = '斜體'
      italicButton.addEventListener('click', () => {
        editor.chain().focus().toggleItalic().run()
      })
      menuBar.appendChild(italicButton)

      // 表格按鈕
      const tableButton = document.createElement('button')
      tableButton.innerHTML = '插入表格'
      tableButton.addEventListener('click', () => {
        editor.chain().focus().insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run()
      })
      menuBar.appendChild(tableButton)

      // 匯出HTML按鈕
      const exportButton = document.createElement('button')
      exportButton.innerHTML = '匯出HTML'
      exportButton.addEventListener('click', () => {
        // 獲取HTML內容
        const html = editor.getHTML()

        // 顯示匯出的HTML
        const exportOutput = document.querySelector('.export-output')
        exportOutput.textContent = html
        exportOutput.style.display = 'block'

        // 創建一個下載連結
        const blob = new Blob([html], { type: 'text/html' })
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url
        a.download = 'exported-content.html'
        a.click()
        URL.revokeObjectURL(url)
      })
      menuBar.appendChild(exportButton)

      // 更新按鈕狀態
      editor.on('selectionUpdate', () => {
        boldButton.classList.toggle('is-active', editor.isActive('bold'))
        italicButton.classList.toggle('is-active', editor.isActive('italic'))
      })
    </script>
  </body>
</html>
