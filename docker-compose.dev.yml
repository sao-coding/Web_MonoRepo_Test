# Docker Compose for Development Environment (10.16.20.11)
# 使用方式: docker compose -f docker-compose.dev.yml up -d --build
#
# Port 配置說明:
# - Traefik: 80 (HTTP), 8080 (Dashboard)
# - 各 App 內部 Port 不對外暴露，由 Traefik 統一路由
# - 避免與現有 PM2 服務衝突 (3001-3003)

# 自動載入環境變數檔案（不需要 --env-file 參數）
x-env-file: &env-file .env.dev

services:
  traefik:
    image: traefik:v3.6.6
    container_name: traefik-dev
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --log.level=DEBUG
    ports:
      - "3000:80"
      - "8090:8080"  # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ai-city
    restart: unless-stopped

  aiforce:
    build:
      context: .
      dockerfile: apps/aiforce/Dockerfile
      args:
        APP_ENV: development
        # NEXT_PUBLIC 變數需要在 build time 傳入
        NEXT_PUBLIC_RD_SITE_URL: ${NEXT_PUBLIC_RD_SITE_URL}
        NEXT_PUBLIC_LOGIN_API_URL: ${NEXT_PUBLIC_LOGIN_API_URL}
        NEXT_PUBLIC_BASE_PATH_URL: ${NEXT_PUBLIC_BASE_PATH_URL:-/AI_City}
        NEXT_PUBLIC_COOKIE_DOMAIN: ${NEXT_PUBLIC_COOKIE_DOMAIN}
        NEXT_PUBLIC_NIM_SERVICE_API_URL: ${NEXT_PUBLIC_NIM_SERVICE_API_URL}
        NEXT_PUBLIC_PATENT_SERVICE_API_URL: ${NEXT_PUBLIC_PATENT_SERVICE_API_URL}
        NEXT_PUBLIC_AI_API_URL: ${NEXT_PUBLIC_AI_API_URL}
        NEXT_PUBLIC_VGA_AI_API_URL: ${NEXT_PUBLIC_VGA_AI_API_URL}
        NEXT_PUBLIC_AIforce_API_URL: ${NEXT_PUBLIC_AIforce_API_URL:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
    container_name: aiforce-dev
    environment:
      - NODE_ENV=production
      - APP_ENV=development
      - PORT=3001
      - HOSTNAME=0.0.0.0
    env_file:
      - .env       # 公開參數 (URLs/IPs) - 上版控
      - .config    # 機密參數 (tokens/keys) - CI/CD 注入
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aiforce.rule=PathPrefix(`/AI_City`)"
      - "traefik.http.routers.aiforce.priority=1"
      - "traefik.http.routers.aiforce.entrypoints=web"
      - "traefik.http.services.aiforce.loadbalancer.server.port=3001"
    networks:
      - ai-city
    restart: unless-stopped
    depends_on:
      - traefik

  aiforce-productspec:
    build:
      context: .
      dockerfile: apps/aiforce-productspec/Dockerfile
      args:
        APP_ENV: development
    container_name: aiforce-productspec-dev
    environment:
      - NODE_ENV=production
      - APP_ENV=development
      - PORT=3002
      - HOSTNAME=0.0.0.0
    env_file:
      - .env       # 公開參數 (URLs/IPs) - 上版控
      - .config    # 機密參數 (tokens/keys) - CI/CD 注入
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aiforce-productspec.rule=PathPrefix(`/AI_City/ProductSpec`)"
      - "traefik.http.routers.aiforce-productspec.priority=10"
      - "traefik.http.routers.aiforce-productspec.entrypoints=web"
      - "traefik.http.services.aiforce-productspec.loadbalancer.server.port=3002"
    networks:
      - ai-city
    restart: unless-stopped
    depends_on:
      - traefik

  aiforce-asr:
    build:
      context: .
      dockerfile: apps/aiforce-asr/Dockerfile
      args:
        APP_ENV: development
    container_name: aiforce-asr-dev
    environment:
      - NODE_ENV=production
      - APP_ENV=development
      - PORT=3003
      - HOSTNAME=0.0.0.0
    env_file:
      - .env       # 公開參數 (URLs/IPs) - 上版控
      - .config    # 機密參數 (tokens/keys) - CI/CD 注入
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aiforce-asr.rule=PathPrefix(`/AI_City/asr`)"
      - "traefik.http.routers.aiforce-asr.priority=10"
      - "traefik.http.routers.aiforce-asr.entrypoints=web"
      - "traefik.http.services.aiforce-asr.loadbalancer.server.port=3003"
    networks:
      - ai-city
    restart: unless-stopped
    depends_on:
      - traefik

  aiforce-translate:
    build:
      context: .
      dockerfile: apps/aiforce-translate/Dockerfile
      args:
        APP_ENV: development
    container_name: aiforce-translate-dev
    environment:
      - NODE_ENV=production
      - APP_ENV=development
      - PORT=3004
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
      - .config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aiforce-translate.rule=PathPrefix(`/AI_City/translate`)"
      - "traefik.http.routers.aiforce-translate.priority=10"
      - "traefik.http.routers.aiforce-translate.entrypoints=web"
      - "traefik.http.services.aiforce-translate.loadbalancer.server.port=3004"
    networks:
      - ai-city
    restart: unless-stopped
    depends_on:
      - traefik

  aiforce-tts:
    build:
      context: .
      dockerfile: apps/aiforce-tts/Dockerfile
      args:
        APP_ENV: development
    container_name: tts-dev
    environment:
      - NODE_ENV=production
      - APP_ENV=development
      - PORT=3005
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
      - .config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aiforce-tts.rule=PathPrefix(`/AI_City/tts`)"
      - "traefik.http.routers.aiforce-tts.priority=10"
      - "traefik.http.routers.aiforce-tts.entrypoints=web"
      - "traefik.http.services.aiforce-tts.loadbalancer.server.port=3005"
    networks:
      - ai-city
    restart: unless-stopped
    depends_on:
      - traefik

  aiforce-img2text:
    build:
      context: .
      dockerfile: apps/aiforce-img2text/Dockerfile
      args:
        APP_ENV: development
    container_name: aiforce-img2text-dev
    environment:
      - NODE_ENV=production
      - APP_ENV=development
      - PORT=3006
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
      - .config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aiforce-img2text.rule=PathPrefix(`/AI_City/img2text`)"
      - "traefik.http.routers.aiforce-img2text.priority=10"
      - "traefik.http.routers.aiforce-img2text.entrypoints=web"
      - "traefik.http.services.aiforce-img2text.loadbalancer.server.port=3006"
    networks:
      - ai-city
    restart: unless-stopped
    depends_on:
      - traefik

  aiforce-patents:
    build:
      context: .
      dockerfile: apps/aiforce-patents/Dockerfile
      args:
        APP_ENV: development
    container_name: aiforce-patents-dev
    environment:
      - NODE_ENV=production
      - APP_ENV=development
      - PORT=3007
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
      - .config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aiforce-patents.rule=PathPrefix(`/AI_City/patents`)"
      - "traefik.http.routers.aiforce-patents.priority=10"
      - "traefik.http.routers.aiforce-patents.entrypoints=web"
      - "traefik.http.services.aiforce-patents.loadbalancer.server.port=3007"
    networks:
      - ai-city
    restart: unless-stopped
    depends_on:
      - traefik

networks:
  ai-city:
    driver: bridge
